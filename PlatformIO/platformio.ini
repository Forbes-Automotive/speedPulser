[platformio]
src_dir = src
include_dir = include
data_dir = data
build_dir = .pio/build

[env:lolin_c3_mini]
; Arduino-ESP32 3.x / ESP-IDF 5.x (pioarduino). Provides the unified
; esp_pm_config_t and the pin-based ledcWrite() behaviour handled in code.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200

; Target settings for ESP32-C3/LOLIN C3
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

; Partition scheme for OTA updates
board_build.partitions = default.csv
board_build.filesystem = littlefs

; Libraries (Arduino-ESP32 3.x compatible)
; ESPAsyncWebServer/AsyncTCP use the mathieucarbou forks, which are the
; maintained versions that build against Arduino-ESP32 3.x / ESP-IDF 5.x.
lib_deps = 
    RobTillaart/RunningMedian
    plerup/espsoftwareserial
    mathieucarbou/ESPAsyncWebServer
    bblanchon/ArduinoJson
    mathieucarbou/AsyncTCP

; Build flags
build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_LOOP_STACK_SIZE=8192
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Master serial-debug switch. Set to 0 (or delete) for a silent release build.
    ; Per-subsystem [TAG] toggles live in include/speedPulser_defs.h.
    -D enableDebug=1

; Monitor port. Do NOT use a COM* wildcard here: this PC also exposes COM3
; (Intel AMT SOL), and the wildcard resolves to the lowest number first, so the
; monitor listened to COM3 instead of the board. Pin the C3's USB-Serial/JTAG
; port (VID:PID 303A:1001). Update the number if Windows re-enumerates it.
monitor_port = COM72
; esp32_exception_decoder turns a raw panic/backtrace into decoded file:line so
; crashes (e.g. during feedback) are readable; direct passes bytes through.
monitor_filters = esp32_exception_decoder, direct
; ESP32-C3 native USB (USB-Serial/JTAG): DTR/RTS are the reset/boot lines. If the
; monitor asserts them on open it resets the chip or holds it in the bootloader,
; so nothing prints. Pin both low so the monitor only observes.
monitor_dtr = 0
monitor_rts = 0

; Upload over serial (USB CDC/UART)
upload_protocol = esptool
upload_speed = 921600

; OTA configuration (optional)
; upload_protocol = espota
; upload_port = 192.168.1.x
; upload_flags = --auth=password

; Debug settings (optional, uncomment for debugging)
; debug_tool = esp-prog
; debug_init_break = tbreak setup

; Testing (optional)
; test_dir = test
